  <!-- Colorful bar under roof -->
  <rect x="20" y="33" width="5" height="3" fill="#29b431"/>
  <rect x="25" y="33" width="5" height="3" fill="#fdb615"/>
  <rect x="30" y="33" width="4" height="3" fill="#fd7b15"/>
  <rect x="34" y="33" width="5" height="3" fill="#ea2929"/>
  <rect x="39" y="33" width="5" height="3" fill="#228ceb"/>
</svg>
