  <circle cx="32" cy="32" r="32" fill="#24221f"/>
  <!-- House body -->
  <rect x="20" y="32" width="24" height="18" rx="2" fill="white"/>
  <!-- Roof -->
  <polygon points="32,14 14,34 50,34" fill="white"/>
  <!-- Door -->
